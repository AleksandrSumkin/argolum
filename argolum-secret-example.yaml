# ==============================================================================
# ArgoCD Local User Secret for argolum
# ==============================================================================
# This Secret defines a local ArgoCD user managed declaratively by argolum.
# When applied to the Kubernetes cluster, argolum detects this Secret,
# hashes the password via bcrypt, registers the user in 'argocd-cm', updates
# 'argocd-secret', and assigns specified roles in 'argocd-rbac-cm'.
#
# Can be committed directly with Sealed Secrets / SOPS, or generated dynamically
# via External Secrets Operator (ESO) / Vault Secret Operator (VSO).
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  # Name of the Kubernetes Secret resource (can be anything unique)
  name: argocd-local-user-jenkins
  # Namespace must match the ArgoCD installation namespace watched by argolum
  # (default: same namespace where argolum is running, e.g., 'argocd')
  namespace: argocd
  labels:
    # REQUIRED LABELS:
    # argolum filters secrets using these labels. Both must match controller config:
    # - LABEL_NAME (default: "argolum")
    # - LABEL_PART_OF (default: "argocd")
    app.kubernetes.io/name: argolum
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # [REQUIRED] ArgoCD local username to provision.
  # Constraints:
  # - Must be a valid ArgoCD username identifier.
  # - Cannot be 'admin' or any username listed in IGNORE_USERS.
  username: jenkins

  # [REQUIRED] Plaintext password for the user.
  # Security Note:
  # - argolum hashes this password using bcrypt (configurable BCRYPT_COST)
  #   and securely writes the hash to 'argocd-secret' under key 'accounts.<username>.password'.
  # - The plaintext value is NEVER written to ArgoCD ConfigMaps or logs.
  # - When rotating this password, simply update this field; argolum will
  #   re-hash and update ArgoCD credentials automatically without restarting pods.
  password: jenkinspass123!

  # [REQUIRED] User status flag.
  # Values: "true" | "false"
  # - "true":  Account is active and usable.
  # - "false": Account is disabled in 'argocd-cm' (cannot authenticate).
  enabled: "true"

  # [REQUIRED] Ability to generate API tokens.
  # Values: "true" | "false"
  # - "true":  Allows creating JWT auth tokens via 'argocd account generate-token'.
  # - "false": Disallows API token generation for this user.
  # Recommended "true" for CI/CD automation and bot accounts.
  apiKey: "true"

  # [REQUIRED] Ability to log in via UI and CLI.
  # Values: "true" | "false"
  # - "true":  Allows interactive password login via Web UI and 'argocd login'.
  # - "false": Disallows password login (recommended for machine-only accounts
  #            that strictly authenticate via JWT API tokens).
  login: "false"

  # [OPTIONAL] Comma-separated list of ArgoCD RBAC roles assigned to this user.
  # Format options:
  # - Project-level roles: "proj:<project-name>:<role-name>"
  # - Global built-in roles: "role:readonly", "role:admin"
  # Example: "proj:frontend:admin,proj:backend:read,role:readonly"
  #
  # argolum automatically synchronizes these into 'argocd-rbac-cm' (policy.csv)
  # within an isolated block delimited by:
  #   # --- ARGOLUM MANAGED USERS BEGIN ---
  #   # --- ARGOLUM MANAGED USERS END ---
  # Policies outside this block remain completely untouched.
  roles: "proj:my-project:admin,proj:public-project:read"
