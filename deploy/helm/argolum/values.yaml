# Default values for argolum.
replicaCount: 1

image:
  repository: ghcr.io/AleksandrSumkin/argolum
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

config:
  watchNamespace: ""
  argocdCMName: ""
  argocdSecretName: ""
  argocdRBACCMName: ""
  labelName: "argolum"
  labelPartOf: "argocd"
  bcryptCost: 10
  pruneOrphanUsers: false
  pruneInterval: "10m"
  ignoreUsers: "admin"
  logLevel: "info"
  logFormat: "json"
  metricsBindAddr: ":8080"
  healthProbeBindAddr: ":8081"

env: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
